[project]
name = "ic-shm-2026-project2"
version = "0.1.0"
description = "Structure-Aware 3D Semantic Point Cloud Reconstruction for Cable-Stayed Bridges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "open3d>=0.17.0",
    "plotly>=5.15.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "opencv-python-headless>=4.8.0",
    "pycolmap>=0.6.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "albumentations>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing"
testpaths = ["tests"]
